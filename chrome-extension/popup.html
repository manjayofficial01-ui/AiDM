<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 200px;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #f2f6fc;
      color: #1a2b4a;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, #2f80d6, #1a5cb0);
      border-bottom: 1px solid #0f4da8;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo { font-size: 20px; }
    .title { font-size: 14px; font-weight: 700; color: #ffffff; }
    .subtitle { font-size: 10px; color: #cfe2f8; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
    .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade80; }

    .body { padding: 12px 16px; }

    .url-input {
      width: 100%;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid #c3d4ea;
      color: #1a2b4a;
      font-size: 12px;
      border-radius: 6px;
      outline: none;
      margin-bottom: 10px;
    }
    .url-input:focus { border-color: #1c6fce; }
    .url-input::placeholder { color: #7a8ba3; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background: #1c6fce;
      border: 1px solid #0f4da8;
      color: white;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }
    .btn:hover { background: #0f4da8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #ffffff; border: 1px solid #c3d4ea; color: #1a2b4a; }
    .btn-secondary:hover { background: #e3eefa; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .btn-row .btn { flex: 1; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #e4edf9;
      border: 1px solid #c3d4ea;
      border-radius: 6px;
      font-size: 11px;
      color: #3d5a80;
      margin-bottom: 10px;
    }
    .info-value { color: #0f4da8; font-weight: 600; }

    .section-title {
      font-size: 10px;
      color: #3d5a80;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-count {
      background: #cfe2f8;
      color: #0f4da8;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
    }

    .media-list { max-height: 240px; overflow-y: auto; }

    .media-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: #ffffff;
      border: 1px solid #c3d4ea;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      gap: 8px;
    }

    .media-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e4edf9;
      border: 1px solid #c3d4ea;
      border-radius: 4px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .media-info { flex: 1; min-width: 0; }
    .media-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1a2b4a;
      font-weight: 500;
      display: block;
    }
    .media-meta {
      display: flex;
      gap: 8px;
      margin-top: 2px;
      color: #7a8ba3;
      font-size: 10px;
    }
    .media-meta .quality-badge {
      background: #dbeafe;
      color: #0f4da8;
      padding: 0 4px;
      border-radius: 3px;
      font-weight: 600;
    }
    .media-meta .size-badge {
      color: #15803d;
    }
    .media-meta .format-badge {
      color: #b45309;
    }

    .media-btn {
      padding: 4px 10px;
      background: #1c6fce;
      border: 1px solid #0f4da8;
      color: white;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .media-btn:hover { background: #0f4da8; }
    .media-btn.sent { background: #16a34a; border-color: #15803d; }

    .quality-select {
      background: #ffffff;
      border: 1px solid #c3d4ea;
      color: #1a2b4a;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #7a8ba3;
      font-size: 12px;
    }

    .footer {
      padding: 8px 16px;
      border-top: 1px solid #c3d4ea;
      text-align: center;
      font-size: 10px;
      color: #7a8ba3;
    }

    .scan-status {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #0f4da8;
      display: none;
    }
    .scan-status.active { display: block; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f2f6fc; }
    ::-webkit-scrollbar-thumb { background: #a9c2e2; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="logo">⚡</span>
      <div>
        <div class="title">AiDM</div>
        <div class="subtitle">Download Manager</div>
      </div>
    </div>
    <div class="status-dot" id="status-dot" title="Disconnected"></div>
  </div>

  <div class="body">
    <div class="info-bar">
      <span>Status: <span class="info-value" id="connection-status">Checking...</span></span>
      <span>Intercepted: <span class="info-value" id="intercept-count">0</span></span>
    </div>

    <input type="text" class="url-input" id="url-input" placeholder="Paste URL to download..." />

    <div class="btn-row">
      <button class="btn" id="btn-download">⬇️ Download</button>
      <button class="btn btn-secondary" id="btn-scan">🔍 Scan Page</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-grab">🎬 Grab Video (active tab)</button>
    </div>

    <div class="scan-status" id="scan-status">🔍 Scanning for downloadable content...</div>

    <div class="scan-status" id="scan-status">🔍 Scanning for downloadable content...</div>

    <div class="section-title">
      <span>Detected Media</span>
      <span class="section-count" id="media-count">0</span>
    </div>
    <div class="media-list" id="media-list">
      <div class="empty">Click "Scan Page" to find downloadable videos & files</div>
    </div>
  </div>

  <div class="footer">
    AiDM v2.0 • Multi-segment • Video Detection • Quality Selection
  </div>

  <script src="popup.js"></script>
</body>
</html>
